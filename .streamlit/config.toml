# Streamlit configuration file
# This configures the appearance and behavior of your deployed app

[theme]
# Primary color for interactive elements
primaryColor = "#1E88E5"
# Background color for the main content area
backgroundColor = "#FFFFFF"
# Background color for sidebar and other secondary elements
secondaryBackgroundColor = "#F5F5F5"
# Color used for most text
textColor = "#262730"
# Font family for all text
font = "sans serif"

[server]
# Enable CORS for cross-origin requests (must be true for XSRF protection)
enableCORS = true
# Enable XSRF protection
enableXsrfProtection = true
# Max upload size in MB (for future enhancements)
maxUploadSize = 200

[browser]
# Automatically open browser when running locally
gatherUsageStats = false
